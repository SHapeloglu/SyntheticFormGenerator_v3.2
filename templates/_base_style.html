<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f6;color:#1e293b;font-family:Arial,sans-serif}.wrap{max-width:1180px;margin:32px auto;padding:0 20px}.panel,.hero{background:#fff;border-radius:18px;box-shadow:0 12px 34px #0f172a18}.panel{padding:24px}.hero{padding:26px;margin-bottom:20px}h1,h2,h3{color:#1f4e78}.nav{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.btn{display:inline-block;border:0;border-radius:9px;background:#1f4e78;color:#fff;padding:11px 15px;font-weight:700;text-decoration:none;cursor:pointer}.btn.alt{background:#64748b}.btn.warn{background:#9a3412}.btn.good{background:#166534}.btn.small{padding:7px 10px;font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:16px}.muted,.small{color:#64748b}.small{font-size:13px}.flash{padding:12px 14px;border-radius:10px;margin:10px 0}.flash.success{background:#dcfce7;color:#166534}.flash.error{background:#fee2e2;color:#991b1b}.ok{color:#166534}.bad{color:#991b1b}.warnbox{background:#fff7ed;border:1px solid #fdba74;padding:14px;border-radius:10px}.okbox{background:#f0fdf4;border:1px solid #86efac;padding:14px;border-radius:10px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px;border-bottom:1px solid #e2e8f0;vertical-align:top}th{background:#f8fafc}input,select{padding:11px;border:1px solid #cbd5e1;border-radius:9px;font-size:15px}.searchbar{display:flex;gap:8px}.searchbar input{flex:1}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:700;background:#e2e8f0}.badge.ok{background:#dcfce7}.badge.bad{background:#fee2e2}@media(max-width:780px){.grid{grid-template-columns:1fr}.searchbar{display:block}.searchbar input,.searchbar .btn{width:100%;margin-bottom:8px}table{display:block;overflow:auto}}
</style>
